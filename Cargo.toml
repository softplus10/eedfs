[package]
name = "cocryptfs"
version = "0.1.0"
edition = "2024"
license = "Unlicense"
description = "Client-side encrypted filesystem with concurrent multi-client access"
repository = "https://github.com/softplus10/cocryptfs"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
clap = { version = "4.5", features = ["derive", "env"] }
rpassword = "7.5"
env_logger = "0.11"
log = "0.4"
fuser = { version = "0.19", default-features = false }
libc = "0.2"
bytes = "1"

chacha20poly1305 = "0.10"
aes-gcm-siv = "0.11"
argon2 = { version = "0.5", features = ["zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
